# Manual invite for develop (staging database) or production.
#
# Repository secrets this workflow reads:
#   SENDGRID_API_KEY          — sends the invite email
#   DEVELOP_APP_URL           — public origin for develop, e.g. https://staging.betterblog.co
#   PRODUCTION_APP_URL        — public origin for production magic links
#   STAGING_DATABASE_URL      — already used by Database sync
#   PRODUCTION_DATABASE_URL   — already used by Database sync
#
# Develop runs in the staging GitHub environment. Production runs in the
# production environment, so existing production protection rules apply.

name: Invite user

run-name: Invite ${{ inputs.email }} (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to invite the user into"
        type: choice
        required: true
        default: develop
        options:
          - develop
          - production
      email:
        description: "Email address to invite"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: invite-user-${{ inputs.environment }}-${{ inputs.email }}
  cancel-in-progress: false

jobs:
  invite-develop:
    name: Invite to develop
    if: inputs.environment == 'develop'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      APP_URL: ${{ secrets.DEVELOP_APP_URL }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      INVITE_EMAIL: ${{ inputs.email }}
      INVITE_ENVIRONMENT: develop
      INVITE_STRIPE_ENVIRONMENT: sandbox
    steps:
      - name: Require secrets
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL}" ] || { echo "Missing secret STAGING_DATABASE_URL"; exit 1; }
          [ -n "${APP_URL}" ] || { echo "Missing secret DEVELOP_APP_URL"; exit 1; }
          [ -n "${SENDGRID_API_KEY}" ] || { echo "Missing secret SENDGRID_API_KEY"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace=server exec prisma generate

      - name: Send invite
        run: npm run invite-user --workspace=server

  invite-production:
    name: Invite to production
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      INVITE_EMAIL: ${{ inputs.email }}
      INVITE_ENVIRONMENT: production
      INVITE_STRIPE_ENVIRONMENT: live
    steps:
      - name: Require secrets
        run: |
          set -euo pipefail
          [ -n "${DATABASE_URL}" ] || { echo "Missing secret PRODUCTION_DATABASE_URL"; exit 1; }
          [ -n "${APP_URL}" ] || { echo "Missing secret PRODUCTION_APP_URL"; exit 1; }
          [ -n "${SENDGRID_API_KEY}" ] || { echo "Missing secret SENDGRID_API_KEY"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace=server exec prisma generate

      - name: Send invite
        run: npm run invite-user --workspace=server
