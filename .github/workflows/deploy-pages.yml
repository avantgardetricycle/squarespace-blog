name: Deploy scripts to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (terser for script minify)
        run: npm ci

      - name: Build minified scripts for Pages
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/build.mjs --out ./pages-scripts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish minified loader/renderer so loader.js is at /loader.js
          path: ./pages-scripts

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
