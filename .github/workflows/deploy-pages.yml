name: Deploy scripts to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API base URL into loader
        run: |
          API_BASE="${{ vars.API_BASE_URL }}"
          if [ -n "$API_BASE" ]; then
            sed -i "s|__API_BASE_URL__|$API_BASE|g" scripts/loader.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the scripts directory as the site root so loader.js is at /loader.js
          path: ./scripts

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
