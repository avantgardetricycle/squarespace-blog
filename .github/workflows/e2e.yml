name: E2E

on:
  pull_request:
    paths:
      - "client/src/app/pages/Configure.tsx"
      - "client/src/app/components/BlogPreviewIframe.tsx"
      - "scripts/renderer.js"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "client/src/app/pages/Configure.tsx"
      - "client/src/app/components/BlogPreviewIframe.tsx"
      - "scripts/renderer.js"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
